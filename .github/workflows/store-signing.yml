name: MWBP Store signing
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-and-sign:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use the product SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.403'
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -RunTests
      - name: Prepare the unsigned single EXE
        shell: pwsh
        run: '& "./VEIL- MWBP/Build-Release.ps1" -Destination "./unsigned"'
      - name: Upload the exact unsigned executable
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mwbp-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned/VEIL-MWBP-Setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Request manual release-signing approval
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed
      - name: Verify signature and hash the signed bytes
        shell: pwsh
        run: |
          $installer = Join-Path $PWD 'signed/VEIL-MWBP-Setup.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate) {
            throw 'A valid timestamped Authenticode signature is required.'
          }
          if ($signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
            throw 'The signing publisher does not match the approved provider.'
          }
          $hash = Get-FileHash -LiteralPath $installer -Algorithm SHA256
          ($hash.Hash.ToLowerInvariant() + '  VEIL-MWBP-Setup.exe') |
            Set-Content -LiteralPath './signed/SHA256SUMS.txt' -Encoding ascii
      - name: Preserve verified output for manual Store validation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mwbp-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            signed/VEIL-MWBP-Setup.exe
            signed/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
