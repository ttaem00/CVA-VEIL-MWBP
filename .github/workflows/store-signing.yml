name: MWBP Store signing
on:
  workflow_dispatch:
  workflow_run:
    workflows: [MWBP production release signal]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: >-
      github.repository == 'ttaem00/CVA-VEIL-Mouse_Without_Border_Plus' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && vars.MWBP_STORE_AUTO_SUBMIT == 'true' &&
        github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release-id: ${{ steps.release.outputs.release-id }}
      unsigned-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Identify the exact release signal
        id: intent
        if: github.event_name == 'workflow_run'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifact = ./scripts/Get-StoreRunArtifact.ps1 -Kind Intent
          if ($artifact) { "id=$artifact" >> $env:GITHUB_OUTPUT }
      - name: Read the release signal as data only
        if: steps.intent.outputs.id != ''
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          artifact-ids: ${{ steps.intent.outputs.id }}
          merge-multiple: true
          path: ${{ runner.temp }}/mwbp-release-intent
          digest-mismatch: error
      - name: Bind the stable release, source and SignPath run to one commit
        id: release
        if: steps.intent.outputs.id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          $intent = Get-Content -LiteralPath "$env:RUNNER_TEMP/mwbp-release-intent/store-release.json" -Raw | ConvertFrom-Json -AsHashtable
          if ($intent.commit -cne $env:RELEASE_COMMIT -or $env:RELEASE_COMMIT -cne $env:GITHUB_SHA -or
              [string] $intent.releaseId -notmatch '\A[0-9]+\z' -or -not $intent.tag) {
            throw 'The released tag must be the exact reviewed main commit of the signing run.'
          }
          $release = ./scripts/Resolve-StoreRelease.ps1 -Commit $env:GITHUB_SHA -ExpectedTag $intent.tag -ExpectedReleaseId $intent.releaseId
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag=$($release.Tag)" >> $env:GITHUB_OUTPUT
          "release-id=$($release.Release.id)" >> $env:GITHUB_OUTPUT
      - name: Use the product SDK
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.release-id != ''
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.403'
      - name: Build and test
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.release-id != ''
        shell: pwsh
        run: ./build.ps1 -RunTests
      - name: Prepare the unsigned single EXE
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.release-id != ''
        shell: pwsh
        run: '& "./VEIL- MWBP/Build-Release.ps1" -Destination "./unsigned"'
      - name: Upload the exact unsigned executable
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.release-id != ''
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mwbp-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned/VEIL-MWBP-Setup.exe
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    if: needs.build.outputs.unsigned-artifact-id != ''
    runs-on: windows-latest
    timeout-minutes: 40
    environment: mwbp-signing
    steps:
      - name: Check out the exact signing run commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Request manual release-signing approval
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.unsigned-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed
      - name: Verify signature and hash the signed bytes
        shell: pwsh
        env:
          MWBP_SIGNED_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_ID: ${{ needs.build.outputs.release-id }}
        run: |
          $installer = Join-Path $PWD 'signed/VEIL-MWBP-Setup.exe'
          $hash = ./scripts/Get-StoreInstallerHash.ps1 -Path $installer -Version $env:MWBP_SIGNED_VERSION
          ($hash + '  VEIL-MWBP-Setup.exe') |
            Set-Content -LiteralPath './signed/SHA256SUMS.txt' -Encoding ascii
          if ($env:RELEASE_ID) {
            @{
              tag = $env:RELEASE_TAG
              releaseId = $env:RELEASE_ID
              commit = $env:GITHUB_SHA
            } | ConvertTo-Json -Compress | Set-Content -LiteralPath './signed/store-release.json' -Encoding ascii
          }
      - name: Preserve verified output for manual Store validation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mwbp-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            signed/VEIL-MWBP-Setup.exe
            signed/SHA256SUMS.txt
            signed/store-release.json
          if-no-files-found: error
          retention-days: 30
